<svg width="1000" height="200" viewBox="0 0 1000 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Thanks for visiting" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1117"/>
      <stop offset="0.55" stop-color="#0F2547"/>
      <stop offset="1" stop-color="#1F6FEB"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="gGold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE873"/><stop offset="1" stop-color="#F2A900"/></linearGradient>
    <filter id="ds" x="-40%" y="-40%" width="180%" height="190%"><feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.5"/></filter>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="20"/></filter>
    <clipPath id="clip"><rect width="1000" height="200" rx="26"/></clipPath>
  </defs>

  <style>
    text { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
    .float  { animation: float 5s ease-in-out infinite; }
    .float-b{ animation: float 7s ease-in-out infinite reverse; }
    .wave1  { animation: slide 14s linear infinite; }
    .wave2  { animation: slide 22s linear infinite reverse; }
    .tw     { animation: twinkle 3s ease-in-out infinite; }
    @keyframes float   { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    @keyframes slide   { from { transform: translateX(0); } to { transform: translateX(-500px); } }
    @keyframes twinkle { 0%,100% { opacity: .15; } 50% { opacity: 1; } }
  </style>

  <g clip-path="url(#clip)">
    <rect width="1000" height="200" fill="url(#bg)"/>

    <circle cx="180" cy="60" r="70" fill="#58A6FF" opacity="0.35" filter="url(#blur)"/>
    <circle cx="830" cy="50" r="80" fill="#A371F7" opacity="0.3" filter="url(#blur)"/>

    <circle class="tw" cx="70"  cy="35" r="2"   fill="#fff"/>
    <circle class="tw" cx="330" cy="25" r="1.6" fill="#fff" style="animation-delay:-1s"/>
    <circle class="tw" cx="680" cy="30" r="2"   fill="#fff" style="animation-delay:-2s"/>
    <circle class="tw" cx="940" cy="60" r="1.6" fill="#fff" style="animation-delay:-.7s"/>

    <g class="float-b"><circle cx="120" cy="90" r="10" fill="none" stroke="#79C0FF" stroke-opacity="0.6" stroke-width="2"/></g>
    <g class="float"><circle cx="880" cy="95" r="12" fill="none" stroke="#D2A8FF" stroke-opacity="0.6" stroke-width="2"/></g>
    <g class="float-b"><circle cx="260" cy="40" r="6" fill="#79C0FF" opacity="0.7"/></g>
    <g class="float"><circle cx="760" cy="35" r="6" fill="#D2A8FF" opacity="0.8"/></g>

    <!-- floating thank-you pill -->
    <g class="float">
      <rect x="290" y="38" width="420" height="72" rx="36" fill="url(#glass)" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1.5"/>
      <text x="468" y="82" text-anchor="middle" font-size="24" font-weight="600" fill="#FFFFFF">Thanks for visiting</text>
      <g transform="translate(620,73)" filter="url(#ds)"><polygon points="0,-16 4.1,-5.7 15.2,-4.9 6.7,2.2 9.4,12.9 0,7 -9.4,12.9 -6.7,2.2 -15.2,-4.9 -4.1,-5.7" fill="url(#gGold)" stroke="#FFF3A0" stroke-width="1" stroke-linejoin="round"/><polygon points="0,-16 4.1,-5.7 0,0 -4.1,-5.7" fill="#fff" opacity="0.45"/></g>
    </g>

    <!-- moving waves (period 500px, translate -500px = seamless loop) -->
    <g class="wave2" opacity="0.35">
      <path d="M0 128 q125 -34 250 0 t250 0 t250 0 t250 0 t250 0 t250 0 t250 0 t250 0 V200 H0 Z" fill="#58A6FF"/>
    </g>
    <g class="wave1" opacity="0.55">
      <path d="M0 150 q125 30 250 0 t250 0 t250 0 t250 0 t250 0 t250 0 t250 0 t250 0 V200 H0 Z" fill="#1F6FEB"/>
    </g>
    <g class="wave2" opacity="0.9">
      <path d="M0 172 q125 -22 250 0 t250 0 t250 0 t250 0 t250 0 t250 0 t250 0 t250 0 V200 H0 Z" fill="#0D1117"/>
    </g>
  </g>
</svg>
