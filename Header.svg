<svg width="1000" height="280" viewBox="0 0 1000 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Jeevaneshwaran G - Data Analyst, Python Developer, AI and ML Enthusiast" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1117"/><stop offset="0.55" stop-color="#0F2547"/><stop offset="1" stop-color="#1F6FEB"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#79C0FF"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.14"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0.03"/>
    </linearGradient>
    <!-- 3D icon gradients -->
    <linearGradient id="gBlue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5AB0FF"/><stop offset="1" stop-color="#1150C9"/></linearGradient>
    <linearGradient id="gGold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE873"/><stop offset="1" stop-color="#F2A900"/></linearGradient>
    <linearGradient id="gPyBlue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5DA9E9"/><stop offset="1" stop-color="#2B5B9A"/></linearGradient>
    <linearGradient id="gPyYel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFE05C"/><stop offset="1" stop-color="#F0B400"/></linearGradient>
    <linearGradient id="gMetal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F4F7FB"/><stop offset="1" stop-color="#8E9BB0"/></linearGradient>
    <linearGradient id="gRobot" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#B69CFF"/><stop offset="1" stop-color="#5B3FD1"/></linearGradient>
    <linearGradient id="gRed" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF6B6B"/><stop offset="1" stop-color="#C21F3A"/></linearGradient>
    <linearGradient id="gFlame" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF3A0"/><stop offset="0.5" stop-color="#FF9F1C"/><stop offset="1" stop-color="#FF3D00" stop-opacity="0"/></linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF" stop-opacity="0.55"/><stop offset="1" stop-color="#FFF" stop-opacity="0"/></linearGradient>
    <radialGradient id="gEye" cx="0.5" cy="0.4" r="0.6"><stop offset="0" stop-color="#E6FFFF"/><stop offset="1" stop-color="#00D4FF"/></radialGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="ds" x="-40%" y="-40%" width="180%" height="190%"><feDropShadow dx="0" dy="7" stdDeviation="5" flood-color="#000" flood-opacity="0.5"/></filter>
    <clipPath id="clip"><rect width="1000" height="280" rx="26"/></clipPath>
  </defs>

  <style>
    text { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
    .float   { animation: float 6s ease-in-out infinite; }
    .float-b { animation: float 7.5s ease-in-out infinite reverse; }
    .float-c { animation: float 9s ease-in-out infinite; animation-delay: -3s; }
    .drift   { animation: drift 14s ease-in-out infinite alternate; }
    .drift-b { animation: drift 18s ease-in-out infinite alternate-reverse; }
    .tw      { animation: twinkle 3s ease-in-out infinite; }
    .shadow  { animation: shadow 6s ease-in-out infinite; transform-origin: 500px 262px; }
    .flame   { animation: flame .35s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 50% 0%; }
    .blink   { animation: blink 4s infinite; transform-box: fill-box; transform-origin: 50% 50%; }
    .glow    { animation: glow 1.6s ease-in-out infinite alternate; }
    @keyframes float   { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }
    @keyframes drift   { 0% { transform: translateX(-30px); } 100% { transform: translateX(30px); } }
    @keyframes twinkle { 0%,100% { opacity: .15; } 50% { opacity: 1; } }
    @keyframes shadow  { 0%,100% { transform: scaleX(1); opacity: .35; } 50% { transform: scaleX(.85); opacity: .18; } }
    @keyframes flame   { from { transform: scaleY(.8); opacity: .85; } to { transform: scaleY(1.15); opacity: 1; } }
    @keyframes blink   { 0%,92%,100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
    @keyframes glow    { from { opacity: .5; } to { opacity: 1; } }
  </style>

  <g clip-path="url(#clip)">
    <rect width="1000" height="280" fill="url(#bg)"/>

    <g class="drift"><circle cx="140" cy="70" r="90" fill="#58A6FF" opacity="0.45" filter="url(#blur)"/></g>
    <g class="drift-b"><circle cx="860" cy="210" r="110" fill="#A371F7" opacity="0.35" filter="url(#blur)"/></g>
    <g class="drift"><circle cx="520" cy="0" r="80" fill="#1F6FEB" opacity="0.5" filter="url(#blur)"/></g>

    <g class="float"><circle cx="70" cy="215" r="14" fill="none" stroke="#79C0FF" stroke-opacity="0.6" stroke-width="2"/></g>
    <g class="float-b"><circle cx="205" cy="55" r="7" fill="#79C0FF" opacity="0.7"/></g>
    <g class="float-c"><circle cx="330" cy="240" r="10" fill="none" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="2"/></g>
    <g class="float"><circle cx="925" cy="60" r="13" fill="none" stroke="#D2A8FF" stroke-opacity="0.6" stroke-width="2"/></g>
    <g class="float-b"><circle cx="960" cy="150" r="6" fill="#D2A8FF" opacity="0.8"/></g>
    <g class="float-c"><circle cx="690" cy="240" r="8" fill="#79C0FF" opacity="0.6"/></g>

    <circle class="tw" cx="60"  cy="40"  r="2"   fill="#fff"/>
    <circle class="tw" cx="430" cy="30"  r="2"   fill="#fff" style="animation-delay:-2s"/>
    <circle class="tw" cx="640" cy="40"  r="1.6" fill="#fff" style="animation-delay:-.5s"/>
    <circle class="tw" cx="950" cy="245" r="1.6" fill="#fff" style="animation-delay:-2.5s"/>

    <!-- ========== 3D-style icons ========== -->

    <!-- Analytics tile -->
    <g class="float-b"><g transform="translate(120,118)" filter="url(#ds)">
      <rect x="-32" y="-32" width="64" height="64" rx="15" fill="url(#gBlue)"/>
      <path d="M-32 0 V-17 a15 15 0 0 1 15 -15 H17 a15 15 0 0 1 15 15 V0 Z" fill="url(#gloss)" opacity="0.6"/>
      <rect x="-20" y="4"  width="9" height="18" rx="2.5" fill="#fff"/>
      <rect x="-5"  y="-8" width="9" height="30" rx="2.5" fill="#fff"/>
      <rect x="10"  y="-20" width="9" height="42" rx="2.5" fill="url(#gGold)"/>
      <polyline points="-22,-6 -6,-18 8,-10 22,-26" fill="none" stroke="#B8FFDF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g></g>

    <!-- Python badge -->
    <g class="float"><g transform="translate(880,150)" filter="url(#ds)">
      <circle r="34" fill="#0B1B36" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1.5"/>
      <rect x="-22" y="-24" width="27" height="27" rx="10" fill="url(#gPyBlue)"/>
      <rect x="-5"  y="-3"  width="27" height="27" rx="10" fill="url(#gPyYel)"/>
      <circle cx="-13" cy="-15" r="2.6" fill="#fff"/>
      <circle cx="13"  cy="15"  r="2.6" fill="#fff"/>
      <path d="M-22 -12 a10 10 0 0 1 10 -12 h10" fill="none" stroke="#fff" stroke-opacity="0.5" stroke-width="2" stroke-linecap="round"/>
      <path d="M-30 -14 a34 34 0 0 1 22 -20" fill="none" stroke="#fff" stroke-opacity="0.35" stroke-width="2.5" stroke-linecap="round"/>
    </g></g>

    <!-- Robot -->
    <g class="float-c"><g transform="translate(180,212) scale(.8)" filter="url(#ds)">
      <line x1="0" y1="-38" x2="0" y2="-26" stroke="#B7BFD1" stroke-width="3" stroke-linecap="round"/>
      <circle class="glow" cx="0" cy="-42" r="5" fill="#FF5C8A"/>
      <rect x="-32" y="-26" width="64" height="52" rx="16" fill="url(#gRobot)"/>
      <path d="M-32 -6 V-10 a16 16 0 0 1 16 -16 H16 a16 16 0 0 1 16 16 V-6 Z" fill="url(#gloss)" opacity="0.5"/>
      <rect x="-40" y="-8" width="8" height="20" rx="4" fill="#8E9BB0"/>
      <rect x="32"  y="-8" width="8" height="20" rx="4" fill="#8E9BB0"/>
      <rect x="-24" y="-16" width="48" height="26" rx="10" fill="#0B1B36"/>
      <g class="blink"><circle cx="-11" cy="-3" r="6" fill="url(#gEye)"/></g>
      <g class="blink"><circle cx="11"  cy="-3" r="6" fill="url(#gEye)"/></g>
      <path d="M-9 17 q9 6 18 0" fill="none" stroke="#fff" stroke-opacity="0.85" stroke-width="2.5" stroke-linecap="round"/>
    </g></g>

    <!-- Rocket -->
    <g class="float-b"><g transform="translate(818,66) rotate(35) scale(.8)" filter="url(#ds)">
      <path class="flame" d="M-8 18 Q0 50 8 18 Z" fill="url(#gFlame)"/>
      <path d="M-13 8 L-27 26 L-13 20 Z" fill="url(#gRed)"/>
      <path d="M13 8 L27 26 L13 20 Z" fill="url(#gRed)"/>
      <path d="M0 -36 C16 -22 18 0 13 20 H-13 C-18 0 -16 -22 0 -36 Z" fill="url(#gMetal)"/>
      <path d="M0 -36 C7 -30 11 -25 13 -17 H-13 C-11 -25 -7 -30 0 -36 Z" fill="url(#gRed)"/>
      <circle cx="0" cy="-3" r="8" fill="#0B1B36"/>
      <circle cx="0" cy="-3" r="5.5" fill="url(#gEye)"/>
      <path d="M-9 -22 C-6 -16 -6 -8 -8 4" fill="none" stroke="#fff" stroke-opacity="0.7" stroke-width="2.5" stroke-linecap="round"/>
    </g></g>

    <!-- floating glass card -->
    <ellipse class="shadow" cx="500" cy="262" rx="260" ry="9" fill="#000" filter="url(#soft)"/>
    <g class="float">
      <rect x="240" y="52" width="520" height="164" rx="26" fill="url(#glass)" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="1.5"/>
      <text x="500" y="122" text-anchor="middle" font-size="46" font-weight="700" fill="url(#txt)">Jeevaneshwaran G</text>
      <text x="500" y="160" text-anchor="middle" font-size="17" fill="#C9D1D9" letter-spacing="2">DATA ANALYST  •  PYTHON DEVELOPER  •  AI &amp; ML</text>
      <rect x="440" y="180" width="120" height="4" rx="2" fill="#58A6FF" opacity="0.9"/>
    </g>
  </g>
</svg>
